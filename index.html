<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DAMA WhatsApp — داما</title>
<meta name="theme-color" content="#04080f"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04080f; --bg2:#08111f; --card:#0c1a33; --card2:#112347;
  --line:rgba(46,124,255,.30); --line2:rgba(46,124,255,.55);
  --blue:#1f6bff; --blue2:#4aa3ff; --text:#eaf1ff; --mute:#8296b8;
  --ok:#2ecc71; --danger:#ff5a6a; --glow:0 0 18px rgba(31,107,255,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Cairo,Tahoma,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;outline:none}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}

/* ---------- Layout ---------- */
#app{position:fixed;inset:0;display:flex;background:
  radial-gradient(900px 500px at 85% -10%,rgba(31,107,255,.18),transparent 60%),
  radial-gradient(700px 500px at 0% 110%,rgba(31,107,255,.12),transparent 60%),var(--bg)}
#main{display:flex;flex-direction:column;width:100%;height:100%;min-width:0;padding-top:env(safe-area-inset-top,0)}
#empty{display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--mute);text-align:center}
@media(min-width:900px){
  #main{width:420px;flex:none;border-inline-end:1px solid var(--line)}
  #empty{display:flex}
}
.screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20;animation:slide .22s ease-out;
  padding-top:env(safe-area-inset-top,0)}
@keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@media(min-width:900px){.screen.pane{inset:0 auto 0 0;width:calc(100% - 420px);background:
  radial-gradient(700px 400px at 70% 0%,rgba(31,107,255,.10),transparent 60%),var(--bg)}}

/* ---------- Bars ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(8,17,31,.85);backdrop-filter:blur(8px);min-height:60px}
.bar .ttl{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.bar .ttl b{font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl small{color:var(--blue2);font-size:.76rem}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text);flex:none}
.ib:hover{background:rgba(46,124,255,.14)}
.brand{display:flex;align-items:center;gap:8px;flex:1}
.brand b{font-weight:800;letter-spacing:.12em;font-size:1.05rem;line-height:1}
.brand small{display:block;color:var(--blue2);font-size:.7rem;font-weight:700;letter-spacing:.04em;line-height:1.1}

/* ---------- Avatars ---------- */
.av{position:relative;width:var(--s,46px);height:var(--s,46px);border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:calc(var(--s,46px)*.4);flex:none;
  border:1.5px solid var(--line2);box-shadow:0 0 0 3px rgba(5,10,20,.8)}
.av i.on{position:absolute;bottom:0;inset-inline-start:0;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.av.ring{border:0;padding:0}
.ringwrap{padding:3px;border-radius:50%;background:conic-gradient(var(--blue2),var(--blue),#0a3a9e,var(--blue2));display:inline-grid}
.ringwrap.seen{background:var(--line)}
.ringwrap .av{box-shadow:0 0 0 3px var(--bg);border:0}

/* ---------- Lists ---------- */
.scroll{flex:1;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;border-bottom:1px solid rgba(46,124,255,.10);width:100%;text-align:start}
.row:hover,.row.active{background:rgba(46,124,255,.10)}
.row .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .mid b{font-size:.98rem;display:flex;align-items:center;gap:5px}
.row .mid span{color:var(--mute);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;color:var(--mute);font-size:.74rem;flex:none}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--blue);color:#fff;font-size:.74rem;font-weight:700;display:grid;place-items:center;padding:0 6px;box-shadow:var(--glow)}
.vf{width:15px;height:15px;color:var(--blue2)}
.search{margin:10px 12px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px;color:var(--mute)}
.search input{flex:1;background:none;border:0;min-width:0}
.empty-note{padding:36px 20px;text-align:center;color:var(--mute);font-size:.92rem}

/* ---------- Bottom nav ---------- */
#nav{display:flex;border-top:1px solid var(--line);background:rgba(8,17,31,.95);padding-bottom:env(safe-area-inset-bottom,0)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--mute);font-size:.7rem;position:relative}
#nav button.on{color:var(--blue2)}
#nav button.on::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:var(--blue);box-shadow:var(--glow)}
#nav .dot{position:absolute;top:5px;inset-inline-end:calc(50% - 18px);min-width:17px;height:17px;border-radius:9px;background:var(--blue);color:#fff;font-size:.62rem;display:grid;place-items:center;padding:0 4px}

/* ---------- Chat ---------- */
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;min-height:0;
  background:radial-gradient(500px 300px at 20% 10%,rgba(31,107,255,.07),transparent 70%)}
.b{max-width:78%;padding:8px 12px 6px;border-radius:14px;background:var(--card);border:1px solid var(--line);align-self:flex-end;font-size:.95rem;line-height:1.55;word-break:break-word;border-end-end-radius:4px}
.b.me{align-self:flex-start;background:linear-gradient(135deg,#1c63f0,#0f3fae);border-color:rgba(120,180,255,.5);border-end-end-radius:14px;border-end-start-radius:4px;box-shadow:0 2px 14px rgba(31,107,255,.28)}
.b .who{font-size:.76rem;font-weight:700;margin-bottom:1px}
.b time{display:flex;justify-content:flex-end;gap:4px;font-size:.68rem;color:rgba(255,255,255,.55);margin-top:1px}
.b.me time{color:rgba(255,255,255,.75)}
.b .img{width:230px;max-width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;margin:2px 0 4px}
.b .img svg{width:100%;height:100%;display:block}
.voice{display:flex;align-items:center;gap:10px;min-width:210px}
.voice .pl{width:38px;height:38px;border-radius:50%;background:var(--blue2);color:#04122e;display:grid;place-items:center;flex:none}
.voice .wave{flex:1;height:26px;display:flex;align-items:center;gap:2px}
.voice .wave i{width:3px;border-radius:2px;background:rgba(255,255,255,.55);height:30%}
.voice.playing .wave i{animation:wv .8s ease-in-out infinite alternate;background:#fff}
@keyframes wv{to{transform:scaleY(1.7)}}
.file{display:flex;align-items:center;gap:10px;min-width:200px}
.file .fi{width:38px;height:38px;border-radius:10px;background:rgba(74,163,255,.18);display:grid;place-items:center;color:var(--blue2)}
.sysmsg{align-self:center;font-size:.76rem;color:var(--mute);background:rgba(12,26,51,.9);border:1px solid var(--line);border-radius:10px;padding:3px 12px}
.pinned{display:flex;gap:8px;align-items:center;margin:8px 12px 0;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:.84rem}
.pinned span{color:var(--mute)}
.emo{display:flex;gap:4px;padding:6px 12px;border-top:1px solid var(--line);background:var(--bg2);overflow-x:auto}
.emo button{font-size:1.5rem;padding:4px 8px;border-radius:10px}
.emo button:hover{background:rgba(46,124,255,.15)}
.composer{display:flex;align-items:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0));border-top:1px solid var(--line);background:var(--bg2)}
.composer input{flex:1;min-width:0;height:44px;border-radius:22px;background:var(--card);border:1px solid var(--line);padding:0 16px}
.composer input:focus{border-color:var(--blue2)}
.fab{width:46px;height:46px;border-radius:50%;background:var(--blue);display:grid;place-items:center;box-shadow:var(--glow);flex:none}
.flip{transform:scaleX(-1)}

/* ---------- Forms / buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:50px;border-radius:14px;font-weight:700;font-size:1rem}
.btn.pri{background:linear-gradient(180deg,#2d7bff,#1559e0);box-shadow:var(--glow);border:1px solid rgba(140,190,255,.5)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.out{border:1px solid var(--line2);background:rgba(12,26,51,.6)}
.btn.out:hover{background:rgba(46,124,255,.14)}
.btn.white{background:#fff;color:#1b2a4a;border:0}
.btn.sm{height:34px;width:auto;padding:0 16px;font-size:.84rem;border-radius:10px}
.btn.danger{border:1px solid rgba(255,90,106,.5);color:var(--danger);background:rgba(255,90,106,.08)}
.field{display:flex;align-items:center;gap:10px;height:52px;border-radius:14px;background:var(--card);border:1px solid var(--line);padding:0 14px;color:var(--mute)}
.field:focus-within{border-color:var(--blue2);box-shadow:var(--glow)}
.field input,.field textarea{flex:1;background:none;border:0;min-width:0;color:var(--text)}
.field.ta{height:auto;padding:10px 14px;align-items:flex-start}
.field.ta textarea{resize:none;height:74px}
.lbl{font-size:.84rem;color:var(--mute);margin:12px 4px 6px;display:block}
.link{color:var(--blue2);font-weight:600}
.err{color:var(--danger);font-size:.84rem;min-height:1.2em;margin:6px 4px}

/* ---------- Auth ---------- */
#auth{position:fixed;inset:0;z-index:40;display:flex;justify-content:center;overflow-y:auto;background:
  radial-gradient(700px 500px at 50% -10%,rgba(31,107,255,.30),transparent 65%),var(--bg)}
.auth-in{width:100%;max-width:420px;padding:calc(36px + env(safe-area-inset-top,0)) 24px 28px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin:6px 0 14px}
.hero h1{font-size:2.1rem;letter-spacing:.14em;font-weight:800;line-height:1.1}
.hero h2{font-size:1.5rem;color:var(--blue2);font-weight:700;line-height:1}
.hero p{color:var(--mute);margin-top:4px}
.sep{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:.85rem}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.avpick{align-self:center;position:relative;width:120px;height:120px;border-radius:50%;border:2px solid var(--blue2);display:grid;place-items:center;background:var(--card);box-shadow:var(--glow);margin:8px 0}
.avpick svg{width:64px;height:64px;fill:none;stroke:var(--blue2);stroke-width:1.6}
.avpick .cam{position:absolute;bottom:2px;inset-inline-end:2px;width:34px;height:34px;border-radius:50%;background:var(--blue);display:grid;place-items:center;border:3px solid var(--bg)}
.avpick.has{font-size:3rem;font-weight:800}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;
  background:radial-gradient(600px 500px at 50% 35%,rgba(31,107,255,.35),transparent 65%),var(--bg);transition:opacity .5s}
#splash h1{font-size:2.4rem;letter-spacing:.16em;font-weight:800;margin-top:8px}
#splash h2{font-size:1.7rem;color:var(--blue2);font-weight:700;line-height:1}
#splash p{color:var(--mute);margin-top:18px;line-height:1.7}
#splash .pb{width:130px;height:4px;border-radius:2px;background:rgba(46,124,255,.2);margin-top:28px;overflow:hidden}
#splash .pb i{display:block;height:100%;width:0;background:var(--blue);box-shadow:var(--glow);animation:load 1.7s ease-in-out forwards}
@keyframes load{to{width:100%}}
#splash .logo{animation:pop .9s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}

/* ---------- Status ---------- */
.stories{display:flex;gap:14px;padding:14px;overflow-x:auto;border-bottom:1px solid var(--line)}
.stories button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78rem;color:var(--mute);flex:none;width:64px}
.mine{position:relative}
.mine .plus{position:absolute;bottom:14px;inset-inline-start:2px;width:22px;height:22px;border-radius:50%;background:var(--blue);display:grid;place-items:center;border:2px solid var(--bg);font-weight:800;font-size:.9rem;line-height:1}
.post{margin:14px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card)}
.post .ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
.post .ph div{flex:1;line-height:1.3}
.post .ph small{display:block;color:var(--mute);font-size:.74rem}
.post .im{aspect-ratio:3/4;max-height:420px;width:100%}
.post .im svg{width:100%;height:100%;display:block}
.post .rp{display:flex;gap:8px;padding:10px;align-items:center}
.post .rp input{flex:1;height:40px;border-radius:20px;background:var(--bg2);border:1px solid var(--line);padding:0 14px;min-width:0}
.viewer{background:#000;z-index:50}
.viewer .vi{position:absolute;inset:0}
.viewer .vi svg{width:100%;height:100%;display:block}
.viewer .top{position:relative;z-index:2;padding:14px 12px;background:linear-gradient(#000a,transparent)}
.prog{display:flex;gap:4px;margin-bottom:10px}
.prog i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.prog i b{display:block;height:100%;width:0;background:#fff}
.prog i.done b{width:100%}
.prog i.run b{animation:fill 5s linear forwards}
@keyframes fill{to{width:100%}}
.viewer .cap{position:relative;z-index:2;margin-top:auto;padding:30px 16px 14px;background:linear-gradient(transparent,#000c);font-size:1.05rem}
.viewer .rpl{position:relative;z-index:2;display:flex;gap:8px;padding:0 12px calc(14px + env(safe-area-inset-bottom,0))}
.viewer .rpl input{flex:1;height:44px;border-radius:22px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.4);padding:0 16px;color:#fff}

/* ---------- Channels ---------- */
.seg{display:flex;margin:0 12px 6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;height:34px;border-radius:9px;color:var(--mute);font-weight:600}
.seg button.on{background:var(--blue);color:#fff;box-shadow:var(--glow)}
.cpost{align-self:stretch;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;line-height:1.7}
.cpost time{display:block;color:var(--mute);font-size:.72rem;margin-top:6px}

/* ---------- Settings / Admin ---------- */
.prof{display:flex;align-items:center;gap:14px;margin:14px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.prof .t{flex:1;line-height:1.35}
.prof small{color:var(--blue2)}
.setrow{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 0;padding:14px 16px;border-bottom:1px solid rgba(46,124,255,.10);text-align:start}
.setrow:hover{background:rgba(46,124,255,.08)}
.setrow .l{flex:1}
.setrow .v{color:var(--mute);font-size:.84rem}
.setrow .chev{color:var(--mute)}
.tg{width:46px;height:26px;border-radius:13px;background:#1b2a48;position:relative;flex:none;transition:.2s}
.tg::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--blue);box-shadow:var(--glow)}
.tg.on::after{inset-inline-start:23px}
.ver{text-align:center;color:var(--mute);font-size:.78rem;padding:18px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px}
.stat div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.5rem;color:var(--blue2)}
.stat span{font-size:.78rem;color:var(--mute)}
.panel{background:rgba(12,26,51,.55);border-bottom:1px solid var(--line);padding:6px 0}
.urow{display:flex;align-items:center;gap:10px;padding:8px 16px}
.urow .n{flex:1;line-height:1.3}
.urow small{color:var(--mute);display:block}
.pad{padding:8px 16px 12px}
.crown{color:#f5c451}

/* ---------- Modal / toast ---------- */
#modal{position:fixed;inset:0;z-index:80;background:rgba(0,4,12,.7);display:grid;place-items:center;padding:20px;backdrop-filter:blur(4px)}
#modal .box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:20px;box-shadow:var(--glow);display:flex;flex-direction:column;gap:12px}
#modal .acts{display:flex;gap:10px}
#toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,20px);background:var(--card2);border:1px solid var(--line2);padding:10px 18px;border-radius:12px;font-size:.88rem;z-index:90;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
#main{position:relative}
.newfab{position:absolute;inset-inline-start:16px;bottom:78px;width:56px;height:56px;border-radius:18px;background:linear-gradient(180deg,#2d7bff,#1559e0);display:grid;place-items:center;box-shadow:var(--glow);z-index:5;border:1px solid rgba(140,190,255,.5)}
.newfab svg{width:26px;height:26px}
.hdinfo{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:start}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none}
.chk.on{background:var(--blue);border-color:var(--blue)}.chk svg{width:14px;height:14px}
.rec{flex:1;display:flex;align-items:center;gap:10px;height:44px;border-radius:22px;background:var(--card);border:1px solid var(--line);padding:0 16px;color:var(--mute)}
.rec b{color:var(--text)}
.rd{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.sbg{width:100%;height:100%;display:grid;place-items:center;padding:24px;text-align:center;font-weight:700;font-size:1.5rem;line-height:1.5;color:#fff}
.sbg p{word-break:break-word}
#lb{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:12px}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
.b .img{background:none;border:0;padding:0}
</style>
</head>
<body>

<!-- shared gradient for logo -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fd8ff"/><stop offset=".45" stop-color="#2a7bff"/><stop offset="1" stop-color="#0b3fb8"/></linearGradient>
</defs></svg>

<div id="splash"></div>

<div id="app" hidden>
  <section id="main"></section>
  <div id="empty"></div>
  <div id="ov" class="screen pane" hidden></div>
</div>
<div id="auth" hidden></div>
<div id="modal" hidden></div>
<div id="toast" role="status"></div>
<div id="lb" hidden></div>
<input type="file" id="fpick" hidden>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signOut, sendPasswordResetEmail, updateProfile, setPersistence, browserLocalPersistence} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, getDoc, setDoc, updateDoc, addDoc, deleteDoc, collection, query, where, orderBy, limit, limitToLast, onSnapshot, serverTimestamp, arrayUnion, arrayRemove, increment, writeBatch, getDocs, runTransaction, getCountFromServer} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* =====================================================================
   DAMA WhatsApp — تطبيق مراسلة حقيقي (Firebase Auth + Firestore)
   الصق إعدادات مشروعك هنا (Firebase Console > Project settings > Your apps > Web)

/* ---------- media ---------- */
function blobToData(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
function imgToData(file, max = 1024, qual = .72) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const i = new Image(); i.onload = () => {
      const k = Math.min(1, max / Math.max(i.width, i.height)), cv = document.createElement('canvas');
      cv.width = Math.round(i.width * k); cv.height = Math.round(i.height * k);
      cv.getContext('2d').drawImage(i, 0, 0, cv.width, cv.height);
      let d = cv.toDataURL('image/jpeg', qual);
      if (d.length > 780000) d = cv.toDataURL('image/jpeg', .5);
      res(d); }; i.onerror = rej; i.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
let rec = null;
async function startRec() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) return toast('متصفحك لا يدعم التسجيل الصوتي');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].find(m => MediaRecorder.isTypeSupported(m)) || '';
    const mr = new MediaRecorder(stream, {...(mime ? {mimeType: mime} : {}), audioBitsPerSecond: 24000});
    rec = {mr, stream, chunks: [], start: Date.now(), mime: mr.mimeType || mime};
    mr.ondataavailable = e => e.data.size && rec && rec.chunks.push(e.data);
    mr.start();
    $('#cmp').innerHTML = `<button class="ib" data-a="reccancel" style="color:var(--danger)" aria-label="إلغاء">${ic('trash')}</button><div class="rec"><i class="rd"></i><b id="rt">0:00</b><span>جارٍ التسجيل...</span></div><button class="fab" data-a="recsend" aria-label="إرسال">${icf('send')}</button>`;
    rec.timer = setInterval(() => { if (!rec) return; const s = Math.floor((Date.now() - rec.start) / 1000), t = $('#rt'); if (t) t.textContent = fmtDur(s); if (s >= 90) stopRec(true); }, 250);
  } catch (e) { rec = null; toast('اسمح باستخدام الميكروفون من إعدادات المتصفح'); }
}
function stopRec(send) {
  if (!rec) return; const r = rec; rec = null; clearInterval(r.timer);
  r.mr.onstop = async () => {
    r.stream.getTracks().forEach(t => t.stop());
    if (!send) return;
    const blob = new Blob(r.chunks, {type: r.mime || 'audio/webm'}), dur = Math.max(1, Math.round((Date.now() - r.start) / 1000));
    if (blob.size > 700000) return toast('التسجيل كبير جداً');
    sendCur({t: 'voice', data: await blobToData(blob), dur}, '🎤 رسالة صوتية');
  };
  try { r.mr.stop(); } catch (e) { r.stream.getTracks().forEach(t => t.stop()); }
  const cmp = $('#cmp'); if (cmp) cmp.innerHTML = composerHTML();
}
let au = null, auId = null;
function togglePlay(id) {

  if (au && auId === id) { au.pause(); au = null; auId = null; return paintPlay(); }
  if (au) au.pause();
  au = new Audio(m.data); auId = id;

document.addEventListener('click', async e => {
  const lb = e.target.closest('#lb'); if (lb) { lb.hidden = true; lb.innerHTML = ''; return; }
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, id = t.dataset.id, v = t.dataset.v;
  try { switch (a) {
    case 'auth': authView(v); break;
    case 'google': googleSignIn(t); break;
    case 'adminlogin': {
      if (t.dataset.g) { adminTry = true; googleSignIn(t); break; }
      const em = $('#em').value.trim(), pw = $('#pw').value;
      if (!okEmail(em)) return setAuthErr('اكتب بريداً إلكترونياً صحيحاً');
      if (!pw) return setAuthErr('اكتب كلمة السر');
      adminTry = true; busy(t, true); try { await signInWithEmailAndPassword(auth, em, pw); try { localStorage.setItem('dama_email', em); } catch (e) {} } catch (x) { adminTry = false; setAuthErr(authMsg(x)); } busy(t, false); break; }
    case 'login': {
      const em = $('#em').value.trim(), pw = $('#pw').value;
      if (!okEmail(em)) return setAuthErr('اكتب بريداً إلكترونياً صحيحاً');
      if (!pw) return setAuthErr('اكتب كلمة السر');
      busy(t, true); try { await signInWithEmailAndPassword(auth, em, pw); try { localStorage.setItem('dama_email', em); } catch (e) {} } catch (x) { setAuthErr(authMsg(x)); } busy(t, false); break;
    }
    case 'forgot': {
      const em = $('#em').value.trim(); if (!okEmail(em)) return setAuthErr('اكتب بريدك أولاً ثم اضغط نسيت كلمة السر');
      try { await sendPasswordResetEmail(auth, em); toast('أرسلنا رابط إعادة التعيين إلى بريدك'); } catch (x) { setAuthErr(authMsg(x)); } break;
    }
    case 'signup': {
      const nm = $('#nm').value.trim(), em = $('#em').value.trim(), pw = $('#pw').value;
      if (nm.length < 2) return setAuthErr('اكتب اسمك الكامل');
      if (!okEmail(em)) return setAuthErr('اكتب بريداً إلكترونياً صحيحاً');
      if (pw.length < 6) return setAuthErr('كلمة السر ٦ أحرف على الأقل');
      busy(t, true);
      try { const r = await createUserWithEmailAndPassword(auth, em, pw); tmpUser.name = nm; try { await updateProfile(r.user, {displayName: nm}); } catch (x) {} }
      catch (x) { setAuthErr(authMsg(x)); } busy(t, false); break;
    }

      catch (x) { setAuthErr(x.message === 'taken' ? 'اسم المستخدم محجوز' : 'تعذر الحفظ: ' + (x.code || x.message)); } busy(t, false); break;
    }
    case 'tgnotif': notifOn = !notifOn; localStorage.setItem('dama_notif', notifOn ? '1' : '0');
      if (notifOn && 'Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); renderTab(); break;
    case 'admin': openAdmin(); break;
    case 'seedgroups': await ensureSysGroups(true); break;
    case 'togro': { const c = chats.find(x => x.id === id); if (!c || !isAdmin) break; await updateDoc(doc(db, 'chats', id), {readOnly: !c.readOnly}); toast(c.readOnly ? 'الأعضاء يقدروا يكتبوا دلوقتي' : 'الكتابة للأدمن بس دلوقتي'); await sleep(250); openInfo(id); break; }
    case 'mrep': { const m = msgs.find(x => x.id === id); if (!m) break;
      confirmBox('إبلاغ عن رسالة', 'هتتبعت الرسالة دي للمشرف للمراجعة.', 'إبلاغ', async () => {
        try { const x = m.t === 'text' ? m.x : (m.t === 'img' && m.data && m.data.length < 400000 ? m.data : (m.name || '')); await addDoc(collection(db, 'reports'), {chat: cur, mid: id, from: m.from, fromName: m.fromName || getU(m.from).name, t: m.t, x, by: uid, byName: me.name, ts: serverTimestamp()}); toast('تم الإبلاغ، شكراً'); }
        catch (x) { toast('تعذر الإبلاغ: ' + (x.code || x.message)); } }); break; }
    case 'rdel': { const r = await getDoc(doc(db, 'reports', id)); if (r.exists()) { const d = r.data(); try { await deleteDoc(doc(db, 'chats', d.chat, 'messages', d.mid)); } catch (x) {} } await deleteDoc(doc(db, 'reports', id)); toast('تم حذف الرسالة'); openAdmin(); break; }
    case 'rban': await updateDoc(doc(db, 'users', t.dataset.u), {banned: true}); await deleteDoc(doc(db, 'reports', id)); toast('تم حظر المرسل'); openAdmin(); break;
    case 'rdis': await deleteDoc(doc(db, 'reports', id)); openAdmin(); break;
    case 'admstory': await deleteDoc(doc(db, 'stories', id)); openAdmin(); break;
    case 'mon': openMonitor(id, t.dataset.n); break;
    case 'allchats': openAllChats(); break;
    case 'monsend': modal('رسالة من المشرف', {ph: 'اكتب الرسالة', ok: 'إرسال', max: 500}, async x => {
      if (!x) return false; const c = t.dataset.c, txt = '[المشرف] ' + x;
      try { const cd = (await getDoc(doc(db, 'chats', c))).data(), upd = {lastText: txt.slice(0, 80), lastFrom: uid, lastTs: serverTimestamp()};
        cd.members.forEach(m => { upd['unread.' + m] = increment(1); });
        await addDoc(collection(db, 'chats', c, 'messages'), {t: 'text', x: txt, from: uid, fromName: 'المشرف', ts: serverTimestamp()}); await updateDoc(doc(db, 'chats', c), upd); toast('تم الإرسال'); }
      catch (e) { toast('تعذر الإرسال: ' + (e.code || e.message)); } openMonChat(c, t.dataset.u, t.dataset.n); }); break;
    case 'monclear': confirmBox('مسح كل الرسائل', 'هتتمسح كل رسايل المحادثة دي للجميع.', 'مسح', async () => { try { await wipeMessages(t.dataset.c); await updateDoc(doc(db, 'chats', t.dataset.c), {lastText: ''}); toast('تم المسح'); } catch (e) { toast('تعذر المسح: ' + (e.code || e.message)); } openMonChat(t.dataset.c, t.dataset.u, t.dataset.n); }); break;
    case 'mondelchat': confirmBox('حذف المحادثة', 'هتتمسح المحادثة ورسايلها نهائياً لكل الأطراف.', 'حذف', async () => { try { await wipeMessages(t.dataset.c); await deleteDoc(doc(db, 'chats', t.dataset.c)); toast('تم حذف المحادثة'); } catch (e) { toast('تعذر الحذف: ' + (e.code || e.message)); } if (t.dataset.u) openMonitor(t.dataset.u, t.dataset.n); else openAllChats(); }); break;
    case 'monkick': confirmBox('إخراج من المجموعة', '', 'إخراج', async () => { try { await updateDoc(doc(db, 'chats', t.dataset.c), {members: arrayRemove(id)}); toast('تم الإخراج'); } catch (e) { toast('تعذر الإخراج: ' + (e.code || e.message)); } openMonChat(t.dataset.c, t.dataset.u, t.dataset.n); }); break;
    case 'monchat': openMonChat(id, t.dataset.u, t.dataset.n); break;
    case 'mondel': confirmBox('حذف الرسالة', 'سيتم حذف الرسالة للجميع.', 'حذف', async () => { try { await deleteDoc(doc(db, 'chats', t.dataset.c, 'messages', id)); } catch (x) { toast('تعذر الحذف'); } openMonChat(t.dataset.c, t.dataset.u, t.dataset.n); }); break;
    case 'deluser': confirmBox('حذف المستخدم نهائياً', 'هيتم حذف حسابه ومحادثاته الفردية وقصصه، وإخراجه من المجموعات، ومنعه من الدخول تاني.', 'حذف', async () => {
      try {
        const cs = await getDocs(query(collection(db, 'chats'), where('members', 'array-contains', id)));
        for (const c of cs.docs) { const d = c.data();
          if (d.type === 'dm') { await wipeMessages(c.id); await deleteDoc(c.ref); }
          else { const rest = d.members.filter(x => x !== id), upd = {members: arrayRemove(id)}; if (d.owner === id && rest.length) upd.owner = rest[0]; await updateDoc(c.ref, upd); } }
        const ss = await getDocs(query(collection(db, 'stories'), where('uid', '==', id))); const b = writeBatch(db);
        ss.docs.forEach(d => b.delete(d.ref)); if (t.dataset.h) b.delete(doc(db, 'handles', t.dataset.h)); b.delete(doc(db, 'users', id)); b.set(doc(db, 'blocked', id), {handle: t.dataset.h || '', ts: serverTimestamp()});
        await b.commit(); toast('تم حذف المستخدم نهائياً'); }
      catch (x) { toast('تعذر الحذف: ' + (x.code || x.message)); } openAdmin(); }); break;
    case 'ban': await updateDoc(doc(db, 'users', id), {banned: t.dataset.b !== '1'}); openAdmin(); break;
    case 'verify': { const c = chanList.find(x => x.id === id); await updateDoc(doc(db, 'channels', id), {verified: !c.verified}); setTimeout(openAdmin, 300); break; }
    case 'mx': $('#modal').hidden = true; $('#modal').innerHTML = ''; break;
    case 'mok': $('#modal')._ok(); break;
  } } catch (x) { console.error(x); toast('حدث خطأ: ' + (x.code || x.message)); busy(t, false); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'inp') { $('#sm').innerHTML = t.value.trim() ? icf('send') : ic('mic'); if (t.value.trim()) typing(); }
  if (t.id === 'pq') { clearTimeout(pkSearch.t); pkSearch.t = setTimeout(() => pkSearch(t.value), 280); }
  if (t.id === 'stx') drawSC();
});

  if (e.key === 'Escape') { const l = $('#lb'); if (!l.hidden) { l.hidden = true; return; } if (!$('#modal').hidden) { $('#modal').hidden = true; $('#modal').innerHTML = ''; } else if (!$('#ov').hidden) closeOv(); }
  if (e.key !== 'Enter' || e.isComposing) return;
  const t = e.target;
  if (t.id === 'inp') sendMic();
  if (t.id === 'cpin') { const b = $('[data-a="cpost"]'); b && b.click(); }

  if (t.matches('[data-sr]')) { const b = $('[data-a="sviewreply"]'); b && b.click(); }
});

init();


/* ---------- التحديث التلقائي ---------- */
(function autoUpdate() {
  if (!/^https?:$/.test(location.protocol)) return;
  let base = null, shown = false;
  const hash = t => { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return h + ':' + t.length; };
  const typing = () => { const a = document.activeElement; return a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.value && a.value.length > 0; };
  const reload = () => { location.replace(location.pathname + '?v=' + Date.now()); };
  const banner = () => {
    shown = true; let n = 6;
    const b = document.createElement('div');
    b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:99999;background:#1f6bff;color:#fff;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.45);font-weight:600';
    b.innerHTML = '<span style="flex:1" id="upT"></span><button id="upB" style="background:#fff;color:#1f6bff;border:0;border-radius:10px;padding:8px 14px;font-weight:700;font-family:inherit">تحديث الآن</button>';
    document.body.appendChild(b);
    b.querySelector('#upB').onclick = reload;
    const tick = () => { if (typing()) { b.querySelector('#upT').textContent = 'يوجد تحديث جديد — هيتم بعد ما تخلّص الكتابة'; return setTimeout(tick, 1500); }
      b.querySelector('#upT').textContent = 'يوجد تحديث جديد · جارٍ التحديث خلال ' + n + ' ث'; if (n-- <= 0) return reload(); setTimeout(tick, 1000); };
    tick();
  };
  let fast = null, tick = 0;
  const sig = r => r.headers.get('etag') || r.headers.get('last-modified') || null;
  const check = async () => {
    if (shown) return; tick++;
    try {
      if (fast !== false) {
        const r = await fetch(location.pathname + '?chk=' + Date.now(), {method: 'HEAD', cache: 'no-store'});
        const sg = r.ok ? sig(r) : null;
        if (sg) { fast = true; if (base === null) base = sg; else if (sg !== base) banner(); return; }
        fast = false;
      }
      if (tick % 5 && base !== null) return;
      const r = await fetch(location.pathname + '?chk=' + Date.now(), {cache: 'no-store'}); if (!r.ok) return;
      const h = hash(await r.text());
      if (base === null) base = h; else if (h !== base) banner();
    } catch (e) {}
  };
  check(); setInterval(check, 3000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  window.addEventListener('focus', check); window.addEventListener('online', check);
})();
</script>
